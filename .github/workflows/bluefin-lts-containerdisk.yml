name: Build Bluefin LTS Containerdisk

on:
  push:
    paths:
      - "containerdisks/bluefin-lts/**"
      - ".github/workflows/bluefin-lts-containerdisk.yml"
  workflow_dispatch:

concurrency:
  group: bluefin-lts-containerdisk
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lf-certification/sandbox-vm-bluefin-lts
  SOURCE_VERSION: "20260814"

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest-8-cores
          - arch: arm64
            runner: ubuntu-latest-8-cores-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-utils

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | sudo podman login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish architecture image
        run: |
          sudo containerdisks/bluefin-lts/build.sh \
            "${IMAGE}:stable-${SOURCE_VERSION}-${{ matrix.arch }}"

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:stable-${SOURCE_VERSION}" \
            "${IMAGE}:stable-${SOURCE_VERSION}-amd64" \
            "${IMAGE}:stable-${SOURCE_VERSION}-arm64"
          docker buildx imagetools inspect "${IMAGE}:stable-${SOURCE_VERSION}"

      - name: Publish stable channel
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:stable" \
            "${IMAGE}:stable-${SOURCE_VERSION}"
