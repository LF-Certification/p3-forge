name: CLI PR checks

on:
  pull_request:
    paths:
      - "cli/lfed/**"
      - ".github/workflows/cli-pr.yml"

permissions: {}

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli/lfed
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install devbox
        uses: jetify-com/devbox-install-action@22b0f5500b14df4ea357ce673fbd4ced940ed6a1 # v0.13.0
        with:
          enable-cache: "true"
          devbox-version: "0.18.4"
          project-path: cli/lfed

      - name: Cache Go modules and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: lfed-go-${{ hashFiles('cli/lfed/go.sum') }}
          restore-keys: lfed-go-

      - name: Lint
        run: devbox run -- make lint

      - name: Test
        run: devbox run -- make test
