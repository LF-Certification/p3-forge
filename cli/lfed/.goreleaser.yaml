version: 2

project_name: lfed

git:
  ignore_tags:
    - "*-v*"
    - "*/*"

snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

builds:
  - id: lfed
    main: ./cmd/lfed
    binary: lfed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/LF-Certification/p3-forge/cli/lfed/internal/build.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: lfed
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --yes
      - --bundle
      - ${signature}
      - ${artifact}

changelog:
  disable: true

release:
  disable: true
